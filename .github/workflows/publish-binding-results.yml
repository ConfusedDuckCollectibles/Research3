# Publish original run 45355476489 only after fixed-byte and independent audit checks.
name: Publish audited binding-study evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-binding-results.yml'
      - 'scripts/publish_binding_results.py'
      - 'scripts/binding_publication_manifest.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-binding-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ConfusedDuckCollectibles/Research3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the exact publication configuration
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Set up the independent arithmetic audit runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - name: Install only the auditor's numerical dependency
        run: python -m pip install numpy==2.4.6
      - name: Verify pinned publication config, audit source and trackability
        id: metadata
        run: >-
          python scripts/publish_binding_results.py
          --metadata --github-output "$GITHUB_OUTPUT"
      - name: Download the original completed or partial study artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          run-id: ${{ steps.metadata.outputs.study_run_id }}
          repository: ConfusedDuckCollectibles/Research3
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/binding-publication/artifact
      - name: Verify fixed original bytes and retained inventory
        run: >-
          python scripts/publish_binding_results.py
          --artifact-dir "$RUNNER_TEMP/binding-publication/artifact"
          --check-only
      - name: Check independent audit arithmetic and failure handling
        run: python scripts/audit_binding_outputs.py --self-test
      - name: Audit original evidence without model execution
        env:
          STUDY_PREFIX: ${{ steps.metadata.outputs.study_prefix }}
        run: >-
          python scripts/audit_binding_outputs.py
          --artifact "$RUNNER_TEMP/binding-publication/artifact/$STUDY_PREFIX"
          --receipt "$RUNNER_TEMP/binding-publication/audit/binding_audit.json"
          --source-root "$GITHUB_WORKSPACE"
      - name: Expose bounded audit diagnostics even on failure
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          path = Path(os.environ["RUNNER_TEMP"]) / "binding-publication/audit/binding_audit.json"
          if not path.is_file():
              print(json.dumps({"audit_receipt": "not_created", "original_evidence_modified": False}))
              raise SystemExit(0)
          raw = path.read_bytes()
          receipt = json.loads(raw)
          evidence = receipt.get("evidence", {})
          provenance = evidence.get("provenance", {})
          retention = evidence.get("retention", {})
          summary = {key: receipt.get(key) for key in (
              "audit_status", "classification", "declared_scientific_status", "error_count",
              "checks", "stage_status", "primary_complete_study_claim_permitted",
              "benchmark_invocations", "model_imports_or_inference", "audit_runtime")}
          summary["first_errors"] = receipt.get("first_errors", [])[:20]
          summary["evidence_sections"] = sorted(evidence)
          summary["provenance"] = {key: provenance.get(key) for key in (
              "source_commit", "run_id", "frozen_design_commit", "scientific_source_rehashed")}
          summary["retention"] = {key: retention.get(key) for key in (
              "files", "bytes", "execution_index_present")}
          summary["receipt_bytes"] = len(raw)
          summary["receipt_sha256"] = hashlib.sha256(raw).hexdigest()
          print(json.dumps(summary, sort_keys=True), flush=True)
          if len(raw) <= 300_000:
              print("BINDING_AUDIT_RECEIPT_BEGIN " + summary["receipt_sha256"], flush=True)
              sys.stdout.write(raw.decode("utf-8"))
              if not raw.endswith(b"\n"):
                  sys.stdout.write("\n")
              print("BINDING_AUDIT_RECEIPT_END", flush=True)
          PY
      - name: Publish verified original bytes and audit receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/publish_binding_results.py
          --artifact-dir "$RUNNER_TEMP/binding-publication/artifact"
          --audit-receipt "$RUNNER_TEMP/binding-publication/audit/binding_audit.json"
          --publish
      - name: Retain the independent audit receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-publication-audit-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: ${{ runner.temp }}/binding-publication/audit/
