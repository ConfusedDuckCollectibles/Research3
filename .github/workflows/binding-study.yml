name: Frozen binding auxiliary-loss study v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binding-study.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-binding-study-v1
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Guard the one permitted empirical execution
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RUN_NUMBER" = "1"
          test "$RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - name: Install the frozen CPU runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.2 numpy==2.4.6 tokenizers==0.21.4 safetensors==0.8.0 huggingface-hub==0.36.2 -e .
      - name: Verify the complete suite before any model outcomes
        shell: bash
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -c 'import torch; from transformers import GPT2LMHeadModel, GPTNeoXForCausalLM; assert torch.__version__ == "2.6.0+cpu"; print(torch.__version__)'
          python -m unittest discover -s tests -v 2>&1 | tee binding-study-tests.log
      - name: Execute the fixed study under its global 1800-second deadline
        run: python scripts/run_binding_study.py
      - name: Preserve all completed and partial study outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-study-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
          path: |
            checkpoints/binding-study/
            binding-study-tests.log
