name: Frozen coefficient packet TCP study v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coefficient-packet-v2.yml'

permissions:
  contents: read

concurrency:
  group: coefficient-packet-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  study:
    if: github.repository == 'ConfusedDuckCollectibles/Research3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Guard the original coefficient execution
        run: |
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - name: Install the fixed numerical runtime
        run: python -m pip install numpy==2.4.6
      - name: Verify all new source syntax
        run: >-
          python -m py_compile
          latent_bridge/coefficient_packet.py
          latent_bridge/coefficient_transport.py
          latent_bridge/coefficient_study.py
          scripts/run_coefficient_study.py
      - name: Check reused deadline and evidence preservation contracts
        run: python -m unittest discover -s tests -p 'test_alignment_execution.py' -v
      - name: Check new packet, transport and complete-slot contracts
        run: python -m unittest discover -s tests -p 'test_coefficient_*.py' -v
      - name: Execute the fixed coefficient study with its 300-second child cap
        run: python scripts/run_coefficient_study.py
      - name: Retain every completed and partial outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coefficient-packet-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
          path: checkpoints/coefficient-packet/
