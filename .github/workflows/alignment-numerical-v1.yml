name: Frozen alignment numerical study v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alignment-numerical-v1.yml'

permissions:
  contents: read

concurrency:
  group: alignment-numerical-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  study:
    if: github.repository == 'ConfusedDuckCollectibles/Research3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Guard the original numerical execution
        run: |
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - name: Install the fixed numerical runtime
        run: python -m pip install numpy==2.4.6
      - name: Verify numerical source syntax
        run: >-
          python -m py_compile
          latent_bridge/alignment_core.py
          latent_bridge/alignment_packet.py
          latent_bridge/alignment_numerical.py
          scripts/run_alignment_numerical.py
      - name: Check deadline supervision and evidence preservation
        run: python -m unittest discover -s tests -p 'test_alignment_execution.py' -v
      - name: Check independent framing and reconstruction contracts
        run: python -m unittest discover -s tests -p 'test_alignment_packet.py' -v
      - name: Check numerical boundaries and required coverage
        run: python -m unittest discover -s tests -p 'test_alignment_core.py' -v
      - name: Execute the fixed numerical study with its 300-second child cap
        run: python scripts/run_alignment_numerical.py
      - name: Retain all completed and partial numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alignment-numerical-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
          path: checkpoints/alignment-numerical/
