name: Public-query conditioning study

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/query-conditioned-study.yml'
      - 'scripts/run_query_conditioned_study.py'

permissions:
  contents: read

concurrency:
  group: query-conditioned-study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.2 -e .
      - name: Verify fresh worlds, public-query controls and gradients
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -c 'import torch; from transformers import GPT2LMHeadModel, GPTNeoXForCausalLM; print(torch.__version__)'
          python -m unittest discover -s tests -v
      - name: Execute the frozen question-conditioning study
        run: python scripts/run_query_conditioned_study.py
      - name: Preserve reports and compressed predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-conditioned-study-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            checkpoints/query-conditioned-study/*.json
            checkpoints/query-conditioned-study/*.md
            checkpoints/query-conditioned-study/*.jsonl.gz
