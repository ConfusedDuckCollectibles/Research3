# Package the original run only; no new study, model, or timing execution.
name: Publish original coefficient evidence and audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-coefficient-results.yml'
      - 'scripts/publish_coefficient_results.py'
      - 'scripts/coefficient_publication_manifest.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-coefficient-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ConfusedDuckCollectibles/Research3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the exact publication configuration
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Set up the independent numerical audit runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - name: Install only the auditor's numerical dependency
        run: python -m pip install numpy==2.4.6
      - name: Verify source syntax
        run: python -m py_compile scripts/audit_coefficient_outputs.py scripts/publish_coefficient_results.py
      - name: Verify fixed config and trackability
        id: metadata
        run: >-
          python scripts/publish_coefficient_results.py
          --metadata --github-output "$GITHUB_OUTPUT"
      - name: Download the single original numerical artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          run-id: ${{ steps.metadata.outputs.study_run_id }}
          repository: ConfusedDuckCollectibles/Research3
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/coefficient-publication/artifact
      - name: Verify exact original bytes and inventory
        id: original
        run: >-
          python scripts/publish_coefficient_results.py
          --artifact-dir "$RUNNER_TEMP/coefficient-publication/artifact"
          --check-only
      - name: Check the independent auditor's elementary controls
        run: python scripts/audit_coefficient_outputs.py --self-test
      - name: Audit original frames, arrays and paired statistics without remeasurement
        id: audit
        env:
          EXPECTED_EXECUTION_SHA256: ${{ steps.metadata.outputs.execution_sha256 }}
        run: >-
          python scripts/audit_coefficient_outputs.py
          --artifact-dir "$RUNNER_TEMP/coefficient-publication/artifact"
          --output "$RUNNER_TEMP/coefficient-publication/audit/coefficient_audit.json"
          --execution-sha256 "$EXPECTED_EXECUTION_SHA256"
      - name: Expose bounded audit diagnostics including negative findings
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          path = Path(os.environ["RUNNER_TEMP"]) / "coefficient-publication/audit/coefficient_audit.json"
          if not path.is_file():
              print(json.dumps({"audit_receipt": "not_created", "original_evidence_modified": False}))
              raise SystemExit(0)
          raw = path.read_bytes()
          value = json.loads(raw)
          summary = {
              "audit_status": value.get("audit_status"),
              "data_integrity_passed": value.get("data_integrity", {}).get("passed"),
              "data_integrity_issues": value.get("data_integrity", {}).get("issue_count"),
              "report_consistency_passed": value.get("report_consistency", {}).get("passed"),
              "report_consistency_issues": value.get("report_consistency", {}).get("issue_count"),
              "required_checks_failed": value.get("scientific_validation", {}).get("required_checks_failed"),
              "receipt_bytes": len(raw), "receipt_sha256": hashlib.sha256(raw).hexdigest(),
              "model_imports_or_inference": value.get("model_imports_or_inference"),
              "timing_measurements": value.get("timing_measurements"),
          }
          print(json.dumps(summary, sort_keys=True), flush=True)
          if len(raw) <= 300000:
              print("COEFFICIENT_AUDIT_RECEIPT_BEGIN " + summary["receipt_sha256"], flush=True)
              sys.stdout.write(raw.decode("utf-8"))
              if not raw.endswith(b"\n"):
                  sys.stdout.write("\n")
              print("COEFFICIENT_AUDIT_RECEIPT_END", flush=True)
          PY
      - name: Publish authenticated original bytes and completed audit findings
        if: always() && steps.original.outcome == 'success' && steps.audit.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/publish_coefficient_results.py
          --artifact-dir "$RUNNER_TEMP/coefficient-publication/artifact"
          --audit-receipt "$RUNNER_TEMP/coefficient-publication/audit/coefficient_audit.json"
          --publish
      - name: Retain the independent audit receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coefficient-publication-audit-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: ${{ runner.temp }}/coefficient-publication/audit/
