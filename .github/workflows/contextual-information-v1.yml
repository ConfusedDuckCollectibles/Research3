name: Frozen contextual information recovery study v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contextual-information-v1.yml'

permissions:
  contents: read

concurrency:
  group: contextual-information-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  study:
    if: github.repository == 'ConfusedDuckCollectibles/Research3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Guard the original contextual information execution
        run: |
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - name: Install the fixed CPU runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.2 numpy==2.4.6 tokenizers==0.21.4 safetensors==0.8.0 huggingface-hub==0.36.2 -e .
      - name: Verify new source syntax
        run: >-
          python -m py_compile
          latent_bridge/information_recovery.py
          latent_bridge/contextual_information.py
          scripts/run_contextual_information.py
      - name: Check reused process-group deadline and evidence preservation
        run: python -m unittest discover -s tests -p 'test_alignment_execution.py' -v
      - name: Check independent information, extraction and accounting contracts offline
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_information_recovery.py' -v
          python -m unittest discover -s tests -p 'test_contextual_*.py' -v
      - name: Execute the fixed assay under its 600-second scientific deadline
        run: python scripts/run_contextual_information.py
      - name: Preserve every completed and partial outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contextual-information-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
          path: checkpoints/contextual-information/
