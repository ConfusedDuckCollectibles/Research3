name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.2 numpy==2.4.6 tokenizers==0.21.4 safetensors==0.8.0 huggingface-hub==0.36.2 -e .
      - name: Verify optional dependencies are available
        run: python -c 'import torch; from transformers import GPT2Config, GPT2LMHeadModel; print(torch.__version__)'
      - name: Test codecs, splits, gradients, and tiny transformer bridge
        run: python -m unittest discover -s tests -v
