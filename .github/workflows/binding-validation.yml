name: Binding implementation validation

on:
  push:
    branches: [main]
    paths:
      - 'latent_bridge/binding_*.py'
      - 'tests/test_binding*.py'
      - 'scripts/run_binding_study.py'
      - '.github/workflows/binding-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binding-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - name: Install the frozen CPU runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.2 numpy==2.4.6 tokenizers==0.21.4 safetensors==0.8.0 huggingface-hub==0.36.2 -e .
      - name: Validate all study code without model outcomes
        shell: bash
        run: |
          python -c 'import torch; from transformers import GPT2LMHeadModel, GPTNeoXForCausalLM; assert torch.__version__ == "2.6.0+cpu"; print(torch.__version__)'
          python -m unittest discover -s tests -v 2>&1 | tee binding-validation.log
      - name: Preserve validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-validation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: binding-validation.log
