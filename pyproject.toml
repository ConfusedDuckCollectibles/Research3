[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research3-latent-bridge"
version = "0.1.0"
description = "Controlled latent communication research with explicit causal controls"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
transformers = ["torch>=2.2", "transformers>=4.45,<6"]

[project.scripts]
latent-bridge-experiment = "latent_bridge.experiment:main"

[tool.setuptools.packages.find]
include = ["latent_bridge*"]
